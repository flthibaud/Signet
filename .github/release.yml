changelog:
  exclude:
    labels:
      - no-changelog
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking-change
    - title: ✨ Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 📦 Dependencies
      labels:
        - dependencies
    # Catch-all, so an unlabelled pull request is still listed rather than
    # silently dropped from the release notes.
    - title: Other changes
      labels:
        - "*"
